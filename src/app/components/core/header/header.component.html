<nav class="bg-primary w-full z-20 top-0 border-b border-primary">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
        <!-- Logo/Brand -->
        <a href="/" class="flex items-center space-x-3 rtl:space-x-reverse">
            <span class="self-center text-2xl font-semibold whitespace-nowrap text-primary">
                <!-- logo -->
            </span>
        </a>

        <!-- Controles de tema y usuario -->
        <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
            <button pButton pRipple [icon]="darkMode ? 'pi pi-sun' : 'pi pi-moon'"
                class="p-button-rounded p-button-text mr-2" (click)="toggleTheme()"></button>

            @if (!isAuthenticated) {
            <p-button routerLink="/auth/login" label="Login" icon="pi pi-user" class="mr-2"></p-button>
            }
            @else {
            <p-button icon="pi pi-user" styleClass="p-button-rounded" [raised]="true"></p-button>
            }

            <!-- pal celu -->
            <button (click)="toggleMobileMenu()" type="button"
                class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-secondary rounded-lg md:hidden hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-gray-200">
                <span class="sr-only">Open main menu</span>
                <i class="pi pi-bars"></i>
            </button>
        </div>
    </div>
</nav>
